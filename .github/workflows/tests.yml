name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    # ubuntu-24.04 fijo: Playwright no tiene navegadores para Ubuntu 26.04 (el ubuntu-latest actual)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
